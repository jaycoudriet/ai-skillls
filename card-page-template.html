    --line: #D5DAE0;
    --structure: #5B6B7A;
    --accent: #E2674A;
    --chip: #E8ECF0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181C;

    }

    --chip: #2E373F; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

  .model { display: flex; align-items: stretch; gap: 0; }

  .obj {
    flex: 1 1 0;
    min-width: 0;
    background: var(--card);
    border: 1.5px solid var(--structure);
    border-radius: 14px;
    padding: 14px;
  }
  .obj h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; padding: 0 2px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px 12px;
  }
  .panel + .panel { margin-top: 10px; }
  .panel h3 { font-size: 12.5px; font-weight: 500; color: var(--muted); margin: 0 0 8px; }
  .panel ul { list-style: none; margin: 0; padding: 0; }
  .attrs li { font-size: 14.5px; padding: 4px 0; border-top: 1px solid var(--line); }
  .attrs li:first-child { border-top: 0; padding-top: 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .acts li {
    font-size: 13.5px; background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 3px 11px;
  }
  .none { color: var(--muted); font-style: italic; font-size: 14px; }

  .link {
    flex: 0 0 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 0 6px; text-align: center; color: var(--accent);
  }
  .link .verb { font-size: 14px; font-weight: 500; }
  .link .card { font-size: 12.5px; color: var(--muted); }
  .link svg { width: 100%; height: 14px; overflow: visible; }

  .link svg.v { display: none; }
